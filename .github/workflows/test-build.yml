name: Test Build

on:
  push:
    branches: [main-go]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Backend tests: go test ./... (fail fast, before Docker build) ──
  # 注意:go test ./... 已在干净 checkout 验证可行 ——
  #   · validation 测试用内联 fixture,不依赖生成的 runtime/core-schema/models.js
  #   · S3 集成测试带 `//go:build integration`,正常 go test 自动跳过(无需 MinIO)
  #   · vault/pb_migrations 新增迁移冒烟 + JSVM 审计钩子测试(真 gate,失败即拦)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: vault/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # packcli TestBuildSchemaProducesLoadableArtifact spawns `node` on the
      # workspace schema builder — needs installed deps, same as the js job.
      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile


      - name: go test ./...
        working-directory: vault
        env:
          GOPROXY: direct
          GONOSUMDB: "*"
        run: go test ./...

  # ── JS behavior tests: node:test suites (pure resolver, hermetic
  #     lifecycle, real-build cache e2e). Previously only runnable by hand ──
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm version is pinned via package.json "packageManager"
      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Packs resolver (pure functions, fixture FS)
        run: pnpm --filter vanblog-app test:packs

      - name: Themes integration (base-alias resolution)
        run: pnpm --filter vanblog-app test:themes

      - name: Pack + theme lifecycle (hermetic, no processes)
        run: pnpm --filter vanblog-app test:lifecycle

      - name: Cache e2e (builds base theme, real HTTP on :4399)
        run: pnpm --filter vanblog-app test:e2e:cache

      - name: ESLint (app, sdk, themes)
        run: npx eslint app/src sdk/src themes/base/src themes/vanblog/src

      - name: Astro check (app + both themes)
        run: pnpm -r check

  # ── Docs quality gate: duplicate-content check (doc-standard §6) ──
  # 要求 S0=0、S1=0、单文件重复率 < 阈值。失败即拦截（doc-dup-check 退出码 1/2）。
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: doc-dup-check
        run: node scripts/check/doc-dup-check.mjs

  # ── Build Docker images (tagged with commit SHA) ──
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [prod, dev]
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=${{ matrix.target }}-,format=long
            type=raw,value=${{ matrix.target }}-edge

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=build-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.target }}

  # ── Full-stack e2e journey: boot the freshly built dev image, run the
  #    macro assertion suite (caddy routing / theme SSR / unlock / visibility /
  #    write-hook freshness / theme switching). This is the layer that would
  #    have caught the 2026-09-15 hook-chain + caddy-topology breaks: unit
  #    fixtures compose differently from production wiring. ──
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot dev container (image built in this run)
        run: |
          docker run -d --name vanblog-e2e \
            -p 8080:8080 \
            -e VANBLOG_HTTP_ONLY=1 \
            "ghcr.io/${GITHUB_REPOSITORY,,}:dev-${{ github.sha }}"

      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8080/api/health; then
              echo "ready after ~$((i*2))s"; exit 0
            fi
            sleep 2
          done
          echo "::error::container not ready in 120s"
          docker logs vanblog-e2e 2>&1 | tail -60
          exit 1

      - name: E2E journey
        run: bash scripts/test/e2e-journey.sh http://localhost:8080

      - name: Container logs on failure
        if: failure()
        run: docker logs vanblog-e2e 2>&1 | tail -120

      - name: Cleanup
        if: always()
        run: docker rm -f -v vanblog-e2e || true

  # ── Lint Go backend (go vet -all + golangci-lint gate) ──
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: vault/go.sum

      - name: go vet -all
        working-directory: vault
        run: go vet -all ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          working-directory: vault
          args: ./...
