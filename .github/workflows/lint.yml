name: Lint

on:
  push:
    branches: [main-go]
  pull_request:

jobs:
  astro-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter sdk build
      - run: pnpm --filter vanblog-app exec astro check

  go-vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: vault/go.sum

      - run: go vet ./...
        working-directory: vault
