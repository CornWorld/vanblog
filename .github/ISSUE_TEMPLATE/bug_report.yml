name: 🐛 Bug 报告
description: 报告一个 bug（安全漏洞请走 SECURITY.md 私有渠道，勿公开）
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告！请尽量填全以下信息，能显著加快排查。
        > ⚠️ 安全漏洞不要在这里提交，请走 [SECURITY.md](../../SECURITY.md) 的私有渠道。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 镜像 tag 或 commit（`docker compose config` 里的 image，或后台显示的版本号）
      placeholder: 例如 prod-2026.08.14 或 v1.0.0
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      description: 你用什么方式部署的？
      options:
        - 一键脚本 (vanblog.sh)
        - docker-compose
        - 手动 docker run
        - 本地构建 / dev 镜像
        - HTTP_ONLY + 外置反代
        - 其他
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 复现网址（可选）
      description: 如果可以在公开站点复现，提供 URL（无法公开可留空）
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么？期望是什么？
      placeholder: 清晰描述现象和期望行为
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 一步一步怎么触发？
      placeholder: |
        1. 进入后台 → 文章 → 新建
        2. 粘贴 xxx 内容
        3. 点击保存
        4. 报错 ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / 截图（可选）
      description: 浏览器控制台、`./vanblog.sh log` 输出、或截图
      render: shell
  - type: input
    id: env
    attributes:
      label: 运行环境
      description: OS / CPU 架构 / 内存
      placeholder: Debian 12 / amd64 / 2C4G
