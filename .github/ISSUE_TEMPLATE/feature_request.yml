name: ✨ 功能建议
description: 提出一个新功能或改进想法
title: "[Feature]: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请描述清楚「要解决什么问题」和「期望的体验」，比直接报功能名更有帮助。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你想完成什么、现在卡在哪？
      placeholder: 例如：想在文章里插入视频附件，现在只能贴 iframe 链接
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案
      description: 你想象中的实现方式（不强制，有更好）
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 前台展示
        - 后台管理
        - 部署 / 运维
        - 主题 / Pack 生态
        - 其他
  - type: checkboxes
    id: known
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，没有重复
          required: true
