<div class="moments-admin max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold mb-6">{{.Title}}</h1>

  <div class="mb-8 border rounded-lg p-4 bg-white dark:bg-gray-800">
    <textarea
      id="moment-content"
      rows="3"
      maxlength="500"
      class="w-full border rounded-lg p-3 resize-none bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100"
      placeholder="有什么想说的？"
    ></textarea>
    <div class="flex items-center justify-between mt-2">
      <span id="char-count" class="text-xs text-gray-400">0/500</span>
      <button
        id="submit-btn"
        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 text-sm"
      >
        发布
      </button>
    </div>
  </div>

  <div id="my-moments" class="space-y-3">
    <div class="text-center py-8 text-gray-400">加载中...</div>
  </div>
</div>

<script type="module">
  const API = "/api/moments";
  const textarea = document.getElementById("moment-content");
  const charCount = document.getElementById("char-count");
  const submitBtn = document.getElementById("submit-btn");
  const listEl = document.getElementById("my-moments");

  function esc(s) {
    const d = document.createElement("div");
    d.textContent = s || "";
    return d.innerHTML;
  }

  textarea.oninput = () => {
    charCount.textContent = textarea.value.length + "/500";
  };

  submitBtn.onclick = async () => {
    const content = textarea.value.trim();
    if (!content) return;
    submitBtn.disabled = true;
    try {
      const res = await fetch(API + "/create", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || "发布失败");
      }
      textarea.value = "";
      charCount.textContent = "0/500";
      await loadMyMoments();
    } catch (err) {
      alert(err.message);
    } finally {
      submitBtn.disabled = false;
    }
  };

  async function loadMyMoments() {
    try {
      const res = await fetch(API + "/list?page=1&perPage=50&mine=1");
      const data = await res.json();
      if (!data.items || data.items.length === 0) {
        listEl.innerHTML =
          '<div class="text-center py-8 text-gray-400">还没有说说</div>';
        return;
      }
      listEl.innerHTML = data.items
        .map((m) => {
          const time = new Date(m.created.replace(" ", "T")).toLocaleString(
            "zh-CN"
          );
          return (
            '<div class="border rounded-lg p-3 bg-white dark:bg-gray-800 flex justify-between items-start gap-2">' +
            '<div class="flex-1"><div class="text-sm text-gray-500 mb-1">' +
            time +
            "</div>" +
            '<div class="whitespace-pre-wrap break-words text-gray-800 dark:text-gray-200">' +
            esc(m.content) +
            "</div>" +
            "</div>" +
            "<button onclick=\"window.deleteMoment('" +
            m.id +
            '\', this)" class="text-red-500 hover:text-red-700 text-sm shrink-0">删除</button>' +
            "</div>"
          );
        })
        .join("");
    } catch (err) {
      listEl.innerHTML =
        '<div class="text-center py-8 text-red-500">加载失败</div>';
    }
  }

  window.deleteMoment = async (id, btn) => {
    if (!confirm("确定删除这条说说？")) return;
    btn.disabled = true;
    try {
      const res = await fetch(API + "/" + id, { method: "DELETE" });
      if (!res.ok) throw new Error("删除失败");
      await loadMyMoments();
    } catch (err) {
      alert(err.message);
      btn.disabled = false;
    }
  };

  loadMyMoments();
</script>
