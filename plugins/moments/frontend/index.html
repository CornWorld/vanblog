<div class="moments-page max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold mb-6">{{.Title}}</h1>

  <div id="moments-app">
    <div class="text-center py-12 text-gray-500">加载中...</div>
  </div>

  <script type="module">
    const API = '/api/moments';

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }

    async function loadMoments(page) {
      page = page || 1;
      const res = await fetch(API + '/list?page=' + page + '&perPage=20');
      if (!res.ok) throw new Error('Failed to load');
      return res.json();
    }

    function renderMoment(m) {
      const time = new Date(m.created.replace(' ', 'T')).toLocaleString('zh-CN');
      return '<article class="moment-card border rounded-lg p-4 mb-4 bg-white dark:bg-gray-800 shadow-sm">'
        + '<div class="flex items-center gap-2 mb-2">'
        + '<span class="font-medium text-sm">' + esc(m.author?.nickname || m.author?.username || '匿名') + '</span>'
        + '<span class="text-xs text-gray-400">' + time + '</span>'
        + '</div>'
        + '<div class="whitespace-pre-wrap break-words text-gray-800 dark:text-gray-200">' + esc(m.content) + '</div>'
        + '</article>';
    }

    async function init() {
      const app = document.getElementById('moments-app');
      try {
        const data = await loadMoments(1);
        if (!data.items || data.items.length === 0) {
          app.innerHTML = '<div class="text-center py-12 text-gray-400">还没有说说，来一条吧~</div>';
          return;
        }
        app.innerHTML = data.items.map(renderMoment).join('');

        if (data.totalPages > 1) {
          const pag = document.createElement('div');
          pag.className = 'flex justify-center gap-2 mt-6';
          for (let p = 1; p <= data.totalPages; p++) {
            const btn = document.createElement('button');
            btn.textContent = p;
            btn.className = p === 1
              ? 'px-3 py-1 rounded bg-blue-600 text-white text-sm'
              : 'px-3 py-1 rounded bg-gray-100 dark:bg-gray-700 text-sm hover:bg-gray-200 dark:hover:bg-gray-600';
            btn.onclick = async () => {
              const d = await loadMoments(p);
              app.innerHTML = d.items.map(renderMoment).join('');
              app.appendChild(pag);
              pag.querySelectorAll('button').forEach((b, i) => {
                b.className = (i + 1) === p
                  ? 'px-3 py-1 rounded bg-blue-600 text-white text-sm'
                  : 'px-3 py-1 rounded bg-gray-100 dark:bg-gray-700 text-sm hover:bg-gray-200 dark:hover:bg-gray-600';
              });
            };
            pag.appendChild(btn);
          }
          app.appendChild(pag);
        }
      } catch (err) {
        app.innerHTML = '<div class="text-center py-12 text-red-500">加载失败，请刷新重试</div>';
      }
    }

    init();
  </script>
</div>
