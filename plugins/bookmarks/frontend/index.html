<div class="bookmarks-page max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold mb-6">{{.Title}}</h1>

  <div id="bookmarks-app">
    <div class="text-center py-12 text-gray-400">加载中...</div>
  </div>

  <script type="module">
    const API = '/api/bookmarks';

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }

    async function loadBookmarks() {
      try {
        const res = await fetch(API + '/list');
        if (!res.ok) throw new Error('Failed');
        const data = await res.json();
        const app = document.getElementById('bookmarks-app');
        if (!data.items || data.items.length === 0) {
          app.innerHTML = '<div class="text-center py-12 text-gray-400">还没有收藏，去后台添加吧~</div>';
          return;
        }
        app.innerHTML = data.items.map(b =>
          '<a href="' + esc(b.url) + '" target="_blank" rel="noopener"'
          + ' class="block border rounded-lg p-4 mb-3 bg-white dark:bg-gray-800 hover:shadow-md transition-shadow no-underline">'
          + '<div class="font-medium text-blue-600 dark:text-blue-400">' + esc(b.title) + '</div>'
          + '<div class="text-sm text-gray-400 mt-1">' + esc(b.url) + '</div>'
          + (b.description ? '<div class="text-sm text-gray-500 mt-1">' + esc(b.description) + '</div>' : '')
          + '</a>'
        ).join('');
      } catch (err) {
        document.getElementById('bookmarks-app').innerHTML = '<div class="text-center py-12 text-red-500">加载失败</div>';
      }
    }

    loadBookmarks();
  </script>
</div>
