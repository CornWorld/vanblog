# Vanblog — docker-compose 一键部署
#
# 两条路径,任选其一:
#
# 1. 一键脚本(推荐新手):
#      curl -L https://raw.githubusercontent.com/cornworld/vanblog/main/vanblog.sh | bash
#    脚本会自动生成 docker-compose.yml 并启动。
#
# 2. 手动编辑本文件:
#      1) 修改下面 VANBLOG_EMAIL 为你的邮箱
#      2) docker compose up -d
#
# 访问:
#   https://your-domain/         — 前台
#   https://your-domain/admin/   — Astro 管理后台
#   https://your-domain/_/       — pb Admin UI
#
# --- HTTP_ONLY 模式(外置反代用户)---
# 把下面的 VANBLOG_HTTP_ONLY=1 取消注释,然后只发布 :80 端口
# (用你的 Traefik / NPM / Cloudflare Tunnel / 反代 Caddy 终止 TLS 后转给它)
# 反代必须传递 X-Forwarded-Proto: https,否则 canonical URL 会错。
#
# --- 紧急回退(TLS 故障时)---
# 取消注释 ports 8080,重启容器,通过 http://your-ip:8080/admin/ 修复配置
# 或运行: ./vanblog.sh maintenance

services:
  vanblog:
    # 选择 prod(不含 Artalk) 或 prod-artalk(含 Artalk 能力，默认仍关闭):
    image: ghcr.io/cornworld/vanblog:${VANBLOG_IMAGE_TAG:-prod}
    # 本地构建: build: { context: ., target: prod }
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # 紧急管理端口(默认不开,需要时取消注释):
      # - "8080:8080"
    volumes:
      - pb_data:/pb_data
      - caddy_data:/data/caddy
      - pack_data:/var/lib/vanblog/packs
      - themes_data:/var/lib/vanblog/themes
      # Artalk 数据(仅 prod-artalk 镜像启用内置 Artalk 时使用):
      - artalk_data:/data/artalk
      # 若要自行维护配置文件，可取消注释(会覆盖自动生成):
      # - ./artalk.yml:/data/artalk/artalk.yml:ro
    environment:
      - VANBLOG_EMAIL=${VANBLOG_EMAIL:-admin@example.com}
      - VANBLOG_CADDY_LOG_LEVEL=${VANBLOG_CADDY_LOG_LEVEL:-warn}
      - VANBLOG_PACKS_DIR=/var/lib/vanblog/packs
      - VANBLOG_THEMES_DIR=/var/lib/vanblog/themes
      # --- Artalk 评论系统 ---
      # 选择 prod-artalk 后，在 /setup 向导中选择是否启用并填写 Artalk 账号。
      # 这里只保留外部 Artalk upstream；它不负责启用状态:
      # - VANBLOG_ARTALK_UPSTREAM=artalk:23366
      # SSO 桥接开关(可选，默认关闭):
      # - VANBLOG_COMMENTS_SSO_ENABLED=1
      # 外部 Artalk 容器(compose 多容器,配合下面 artalk 服务):
      # - VANBLOG_ARTALK_UPSTREAM=artalk:23366
      # HTTP_ONLY 模式:外置反代终止 TLS(取消注释即生效):
      # - VANBLOG_HTTP_ONLY=1
      # pb 内部地址(容器内 127.0.0.1,不需要改):
      # - ASTRO_URL=http://127.0.0.1:4321
      # - PB_URL=http://127.0.0.1:8090

  # --- Artalk 评论系统(compose 多容器模式,可选)---
  # 默认推荐 prod-artalk 镜像；是否启用内置 Artalk 在 /setup 向导中选择。
  # 若要 Artalk 独立容器(独立升级/解耦生命周期),取消下面注释,
  # 并在 vanblog 服务里设 VANBLOG_ARTALK_UPSTREAM=artalk:23366。
  # artalk:
  #   image: artalk/artalk-go
  #   restart: unless-stopped
  #   environment:
  #     - ATK_HOST=0.0.0.0
  #     - ATK_PORT=23366
  #     - ATK_LOCALE=zh-CN
  #     - ATK_SITE_DEFAULT=VanBlog
  #   volumes:
  #     - artalk_data:/data
  #   # 不暴露端口到公网,只被 vanblog 的 Caddy 反代:
  #   # ports: ["23366:23366"]

volumes:
  pb_data:
  caddy_data:
  pack_data:
  themes_data:
  # Artalk 数据卷(内置 sidecar 挂到 vanblog,多容器挂到 artalk 服务):
  artalk_data:
